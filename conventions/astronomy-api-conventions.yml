method: searched
source: >-
  https://docs.astronomyapi.com/ (Getting Started),
  https://docs.astronomyapi.com/requests-and-response/* (observer parameters,
  tabular responses, rows responses, error responses),
  https://docs.astronomyapi.com/known-issues,
  https://docs.astronomyapi.com/api-v3-reference-draft/v3 and
  .../migrating-from-v2, plus openapi/astronomy-api-v3-openapi.yaml and the four
