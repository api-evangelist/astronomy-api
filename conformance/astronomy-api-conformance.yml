domain_standards:
  checked: true
  found: false
  note: >-
    REWARD-ONLY and honestly empty. Astronomy/ephemeris data has interchange
    standards in the research-observatory world — the IVOA suite (VOTable,
    SAMP, TAP/ADQL, VOEvent) and NASA/JPL SPICE kernels — but Astronomy API
    declares none of them in its contract, publishes no VOTable or VOEvent
    media type, and exposes no TAP or OAI-PMH surface. Its response shapes are
    bespoke JSON. This is a commercial developer API rather than an
    observatory data service, and its market has no widely-adopted contract
    standard for a vendor of this shape, so nothing is asserted here.
  probed:
    - standard: IVOA VOTable / VOEvent media types
      found: false
      evidence: No `application/x-votable+xml` or VOEvent reference in any definition or docs page.
    - standard: OGC API / OWS GetCapabilities
