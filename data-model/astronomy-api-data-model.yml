provider: Astronomy API
providerId: astronomy-api
description: >-
  The entity graph of the Astronomy API, derived from the v3 contract because it
  is the only version with declared schemas — the four v2 definitions in
  openapi/ describe operations but no response bodies. This is a REFERENCE data
  model, not a record store: nothing here is created, owned or mutated by the
  caller. Every entity is a computed observation of the sky from a point on the
  Earth at an instant, so the graph has no identity or ownership edges, only
  composition and enumeration edges.
identity:
  caller_owned_entities: none
  id_prefixes: none
  note: >-
    The only identifiers are catalogue and body identifiers the provider does
    not mint per caller — body ids (`sun`, `moon`, `mars`), IAU constellation
    abbreviations, and deep-sky catalogue designations. The one caller-scoped
    identifier in the product, the Application ID, belongs to the dashboard and
    appears in no API response.
entities:
