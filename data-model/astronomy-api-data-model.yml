    kind: value-object
    description: A point on the Earth. Latitude, longitude and optional elevation.
    fields: [latitude, longitude, elevation]
    note: The pivot of the whole model — nearly every value is relative to it.
  - name: Meta
    kind: envelope
    description: Per-response context — the observer echoed back, the timezone, the declared units, the reference frames, and the sampling window.
    fields: [observer, timezone, units, frames, sampling]
  - name: Sampling
    kind: value-object
    description: The time window and step of a positions request, with the continuation cursor.
    fields: [from, to, step, count, nextCursor]
