deprecation:
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  deprecated_operations:
    - operation: GET /bodies
      version: v2
      status: removed-in-v3
      evidence: >-
        "GET /bodies is gone. It returned a fixed list of ten identifiers that
        never change. That list is in the specification, so bodies is an
        enumerated type in generated clients and there is nothing to fetch."
      note: >-
        Not marked `deprecated: true` in the v2 OpenAPI, and no Deprecation or
        Sunset header is served. The removal is announced only in the v3
        migration prose.
    - operation: GET /bodies/positions/{body}
      version: v2
      status: replaced-in-v3
      evidence: 'Migration table: `/bodies/positions/{body}` → `?bodies=mars`.'
    - operation: GET /bodies/events/{body}
      version: v2
      status: replaced-in-v3
      evidence: 'Migration table: `/bodies/events/{body}` → `/events?bodies=moon`.'
  removed_fields:
    - field: position.horizonal.*
      reason: A misspelling of `horizontal` that duplicated it; removed in v3.
    - field: position.constellation.id
      reason: A lowercase copy of the abbreviation; removed in v3.
    - field: output=table|rows
      reason: One response shape in v3; layout is the client's job.
  corrected_fields:
    - field: extraInfo.phase.angel
      correction: Renamed to `phase.angle` — a misspelling that reached the wire.
    - field: extraInfo.phase.fraction
      correction: >-
        Value corrected. v2 reported 0–0.067 and ran backwards (largest at new
        moon, zero at full). v3 reports the lit fraction of the disc, 0 at new
        to 1 at full. The provider states plainly that "anything that
        compensated for the old behaviour needs unwinding."
      severity: breaking-semantics
  continuity_commitment:
    published: true
    quote: >-
      "v2 is unchanged and continues to work; nothing here affects it." /
      "v2 is unchanged and keeps working. Move when it suits you."
    note: >-
      An explicit no-forced-migration statement, but with no dated sunset
      attached, so it is a promise of continuity rather than a deprecation
      policy. There is nothing an agent or a client can read at runtime.
